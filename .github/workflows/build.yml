name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test stitching algorithm
        run: dotnet run --project tests/StitcherTests -c Release

      - name: Build
        run: dotnet build src/ScrollCapture/ScrollCapture.csproj -c Release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ScrollCapture
          path: src/ScrollCapture/bin/Release/ScrollCapture.exe

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/ScrollCapture/bin/Release/ScrollCapture.exe
